[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api.async_timeout]
msg = "use asyncio.timeout instead"

[tool.ruff.lint.flake8-tidy-imports.banned-api.pytz]
msg = "use zoneinfo instead"

[tool.ruff.lint.flake8-tidy-imports.banned-api.tests]
msg = "You should not import tests"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = [
    "propcache.api.cached_property",
]

[tool.bumpver]
current_version = "1.30.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    "^version = \"{version}\"",
    "^current_version = \"{version}\"",
]
"pypetkitapi/__init__.py" = [
    "^__version__ = \"{version}\"",
]

[tool.tox]
min_version = "4.46.3"
requires = [
    "tox>=4.47.3",
    "tox-uv",
]
env_list = [
    "3.14",
    "precommit",
]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
deps = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
commands = [
    [
        "pytest",
        "--cov=pypetkitapi",
        "--cov-config=.coveragerc",
        "--cov-report=xml",
        "--cov-branch",
    ],
]

[tool.tox.env.precommit]
description = "run pre-commit hooks"
deps = [
    "pre-commit>=4.5.1",
]
skip_install = true
commands = [
    [
        "pre-commit",
        "run",
        "--all-files",
    ],
]

[tool.gitleaks.allowlist]
files = [
    "sonar-project.properties",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "pypetkitapi"
version = "1.30.0"
description = "Python client for PetKit API"
authors = [
    { name = "Jezza34000", email = "info@mail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "petkit",
    "api",
    "client",
    "pet",
    "iot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.14.1,<4.0.0",
    "aiofiles>=24.1.0,<26.0.0",
    "pycryptodome>=3.19.1,<4.0.0",
    "m3u8>=6.0.0,<7.0.0",
    "tenacity>=9.1.2,<10.0.0",
    "pydantic>=2.10.4,<3.0.0",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/Jezza34000/pypetkit"
Repository = "https://github.com/Jezza34000/pypetkit"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.17.0",
    "black>=26.0.0",
]
typing = [
    "types-aiofiles>=24.1.0.20240626",
    "mypy>=2.0.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.0.0",
]
